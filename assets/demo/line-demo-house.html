<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>房屋仲介 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-house">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-house">🏠</div>
        <div class="brand-tag">房屋仲介</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">🌟 春季精選物件上線 🌟</span>
        </div>
        <div class="brand-row">
          <span class="icon">🏠</span>
          <h1>房屋仲介</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>專人親自帶看，匹配您的理想條件。</p>
        <p class="sub-line"><span class="em">📌</span>50+ 物件即時查詢，免費諮詢不收費。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約看屋</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">🏡</span><span class="label">本週精選物件</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🔥</span><span class="label">屋主直售特價屋</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">🏢</span><span class="label">新建案賞屋</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">🏘️</span><span class="label">中古屋出售</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">💼</span><span class="label">投資型物件</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">🛋️</span><span class="label">套房 / 雅房</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">區域行情查詢</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">專業房仲諮詢</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的賞屋紀錄</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
