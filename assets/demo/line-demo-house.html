<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=380">
<title>房屋仲介｜LINE 預約示範畫面</title>
<meta name="description" content="作品集裡的 LINE 預約示範畫面：房屋仲介。價格、優惠都是示意。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="line-demo.css">
<style>
  /* 這一頁的照片：放大 1.5 倍，字整段放在黃昏的天空上；屋頂和亮著燈的窗戶在下面。整張調暗 28%，天空才夠深 */
  .hero-photo { object-position: 0% 0%; --photo-transform: scale(1.5); --photo-filter: brightness(0.72); }
</style>
</head>
<body class="shop-house">
<div class="phone">
  <div class="screen">
    <main class="liff">
      <header class="hero">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="sys">
            <svg class="icon" width="18" height="14" viewBox="0 0 18 14"><path d="M2 12v-1M6 12V9M10 12V6M14 12V3"/></svg>
            <svg class="icon" width="18" height="14" viewBox="0 0 18 14"><path d="M2 5.5a10 10 0 0 1 14 0M4.5 8.2a6.4 6.4 0 0 1 9 0M7.2 10.8a2.6 2.6 0 0 1 3.6 0"/></svg>
            <svg class="icon" width="26" height="14" viewBox="0 0 26 14"><rect x="1.5" y="2.5" width="20" height="9" rx="2.5"/><path d="M24 5.5v3"/><rect x="3.5" y="4.5" width="13" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          </span>
        </div>
        <img class="hero-photo" src="photos/house.jpg" alt="黃昏時的現代住宅，大片落地窗裡亮著燈，上面是深藍色的天空">
        <div class="hero-text">
          <h1>房屋仲介</h1>
          <p class="hero-line">專人帶看<br>依你的條件找房子</p>
          <p class="demo-tag">示範畫面</p>
        </div>
      </header>

      <section class="book">
        <button class="primary" type="button">立即預約
          <svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9h10M10 5l4 4-4 4"/></svg>
        </button>
        <p class="note">本週新上架 12 間（示意）</p>
      </section>

      <section class="services" aria-labelledby="srv-title">
        <div class="services-head">
          <h2 id="srv-title">服務項目</h2>
          <p>價格為示意</p>
        </div>
        <ul class="srv-list">
          <li><button class="srv" type="button"><span class="srv-name">本週精選物件</span><span class="srv-meta">這週新上架的房子</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">新建案</span><span class="srv-meta">預售屋和新成屋</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">中古屋</span><span class="srv-meta">電梯大樓、公寓、透天</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">套房・雅房出租</span><span class="srv-meta">月租 NT$8,000 起</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">區域行情查詢</span><span class="srv-meta">附近的成交價</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">賣房委託</span><span class="srv-meta">免費估價</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
        </ul>
      </section>

      <nav class="more" aria-label="其他">
        <button type="button"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5h12v7.5H8l-3 2.5V12H3z"/></svg>房仲諮詢</button>
        <button type="button"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="4" width="12" height="11" rx="2"/><path d="M3 8h12M6.5 2.5v3M11.5 2.5v3"/></svg>我的看屋紀錄</button>
      </nav>
      <p class="fine">示範畫面，價格和優惠都是示意</p>
      <p class="credit">照片：<a href="https://commons.wikimedia.org/wiki/File:Modern-home-dusk_(Creative_Commons).jpg" rel="noopener" target="_blank">vcmxnajg1</a>（<a href="https://creativecommons.org/licenses/by/2.0/" rel="noopener" target="_blank">CC BY 2.0</a>，Wikimedia Commons），已裁切、調暗</p>
    </main>
  </div>
</div>
</body>
</html>
