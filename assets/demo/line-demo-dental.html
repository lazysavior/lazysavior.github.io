<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>牙醫診所 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-dental">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-dental">🦷</div>
        <div class="brand-tag">牙醫診所</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">✨ 新客免費口腔檢查 ✨</span>
        </div>
        <div class="brand-row">
          <span class="icon">🦷</span>
          <h1>牙醫診所</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>專業醫師團隊，給您安心微笑。</p>
        <p class="sub-line"><span class="em">📌</span>線上預約看診，避免現場久候。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約看診</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">🔍</span><span class="label">免費口腔檢查</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🔥</span><span class="label">限時洗牙特價</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">🦷</span><span class="label">一般洗牙 / 保健</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">✨</span><span class="label">齒列矯正諮詢</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">⚪</span><span class="label">牙齒美白療程</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">💎</span><span class="label">植牙諮詢</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">完整療程價目</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">真人客服</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的看診紀錄</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
