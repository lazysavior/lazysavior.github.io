<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>寵物美容沙龍 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-pet">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-pet">🐾</div>
        <div class="brand-tag">寵物美容沙龍</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">✨ 暑期剃毛優惠開放 ✨</span>
        </div>
        <div class="brand-row">
          <span class="icon">🐾</span>
          <h1>寵物美容</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>專業寵物造型師，安心把毛孩交給我們。</p>
        <p class="sub-line"><span class="em">📌</span>線上預約時段，到店免排隊。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約美容</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">🎨</span><span class="label">本月造型優惠</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🔥</span><span class="label">新客首次 8 折</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">🛁</span><span class="label">全身洗澡 SPA</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">✂️</span><span class="label">剪毛造型</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">🐶</span><span class="label">趾甲修剪</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">🦷</span><span class="label">牙齒清潔</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">完整服務價目</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">美容師諮詢</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的預約紀錄</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
