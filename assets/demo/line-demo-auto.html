<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汽車保養廠 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-auto">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-auto">🔧</div>
        <div class="brand-tag">汽車保養廠</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">⚡ 春季健檢專案 8 折 ⚡</span>
        </div>
        <div class="brand-row">
          <span class="icon">🔧</span>
          <h1>汽車保養廠</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>原廠等級保養，車況最安心。</p>
        <p class="sub-line"><span class="em">📌</span>線上預約進廠時段，省去現場等候。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約保養</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">🔍</span><span class="label">免費車況健檢</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🔥</span><span class="label">限時 8 折專案</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">🛢️</span><span class="label">定期保養 / 換油</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">🛞</span><span class="label">輪胎更換 / 平衡</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">🎨</span><span class="label">板金烤漆</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">⚙️</span><span class="label">引擎 / 變速箱檢修</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">完整服務價目</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">技師諮詢</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的保養紀錄</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
