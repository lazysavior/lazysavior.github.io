<html lang="zh-Hant-TW">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="line-demo.css">
<style>
  /* 這一頁的照片：左右翻轉再放大 1.4 倍：原本右邊吊著引擎的暗處移到左上，店名放在那裡；日光燈和紅色老車推到右邊（車頭標誌翻過來也看不出來）。整張調暗 28% */

<body class="shop-auto">
<div class="phone">
  <div class="screen">
    <main class="liff">
      <header class="hero">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="sys">
            <svg class="icon" width="18" height="14" viewBox="0 0 18 14"><path d="M2 12v-1M6 12V9M10 12V6M14 12V3"/></svg>
            <svg class="icon" width="18" height="14" viewBox="0 0 18 14"><path d="M2 5.5a10 10 0 0 1 14 0M4.5 8.2a6.4 6.4 0 0 1 9 0M7.2 10.8a2.6 2.6 0 0 1 3.6 0"/></svg>
            <svg class="icon" width="26" height="14" viewBox="0 0 26 14"><rect x="1.5" y="2.5" width="20" height="9" rx="2.5"/><path d="M24 5.5v3"/><rect x="3.5" y="4.5" width="13" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          </span>
        </div>
        <img class="hero-photo" src="photos/auto.jpg" alt="偏暗的修車廠：一輛紅色老車打開引擎蓋，旁邊的吊架上吊著一具引擎">
        <div class="hero-text">
          <h1>汽車保養廠</h1>
          <p class="hero-line">線上預約進廠時段<br>到場不用等</p>
          <p class="demo-tag">示範畫面</p>
        </div>
      </header>

      <section class="book">
        <button class="primary" type="button">立即預約
          <svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9h10M10 5l4 4-4 4"/></svg>
        </button>
        <p class="note">免費 20 項車況檢查（示意）</p>
      </section>

      <section class="services" aria-labelledby="srv-title">
        <div class="services-head">
          <h2 id="srv-title">服務項目</h2>
          <p>價格為示意</p>
        </div>
        <ul class="srv-list">
          <li><button class="srv" type="button"><span class="srv-name">定期保養</span><span class="srv-meta">約 60 分鐘・NT$1,800 起</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">輪胎更換・平衡</span><span class="srv-meta">約 40 分鐘・看輪胎報價</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">煞車檢查</span><span class="srv-meta">約 30 分鐘・NT$500</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">板金烤漆</span><span class="srv-meta">看損傷估價</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">引擎・變速箱檢修</span><span class="srv-meta">先檢查再報價</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
          <li><button class="srv" type="button"><span class="srv-name">完整服務價目</span><span class="srv-meta">所有項目和工資</span><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4l5 5-5 5"/></svg></button></li>
        </ul>
      </section>

      <nav class="more" aria-label="其他">
        <button type="button"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 4.5h12v7.5H8l-3 2.5V12H3z"/></svg>技師諮詢</button>
        <button type="button"><svg class="icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="4" width="12" height="11" rx="2"/><path d="M3 8h12M6.5 2.5v3M11.5 2.5v3"/></svg>我的保養紀錄</button>

      <p class="fine">示範畫面，價格和優惠都是示意</p>
