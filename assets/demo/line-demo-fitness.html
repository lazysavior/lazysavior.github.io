<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健身工作室 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-fitness">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-fit">💪</div>
        <div class="brand-tag">健身工作室</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">⚡ 春季塑身專案開跑 ⚡</span>
        </div>
        <div class="brand-row">
          <span class="icon">💪</span>
          <h1>健身工作室</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>一對一教練課，量身打造訓練計畫。</p>
        <p class="sub-line"><span class="em">📌</span>線上預約課程，省去現場排隊等候。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約教練課</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">🎁</span><span class="label">體驗價 NT$300</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🔥</span><span class="label">新會員 8 折優惠</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">🏋️</span><span class="label">重訓塑身</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">🏃</span><span class="label">有氧課程</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">🥊</span><span class="label">拳擊有氧</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">🧘</span><span class="label">伸展放鬆</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">完整課程價目表</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">真人教練諮詢</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的課表</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
