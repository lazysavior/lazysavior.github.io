<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美甲工作室 · LINE Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="line-demo.css" />
</head>
<body class="theme-nail">

<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span>9:41</span>
      <span class="right">
        <span>●●●●</span><span>📶</span><span>🔋</span>
      </span>
    </div>

    <div class="liff-area">

      <div class="brand-header">
        <div class="brand-avatar avatar-nail">💅</div>
        <div class="brand-tag">美甲工作室</div>
      </div>

      <div class="hero-card">
        <div class="hot-row">
          <span class="hot-badge">🔥 HOT</span>
          <span class="hot-banner">💖 春季新色登場 💖</span>
        </div>
        <div class="brand-row">
          <span class="icon">💅</span>
          <h1>美甲工作室</h1>
          <span class="icon">✨</span>
        </div>
        <p class="sub-line"><span class="em">✨</span>客製化美甲設計，讓您的指尖也很時尚。</p>
        <p class="sub-line"><span class="em">📌</span>24 小時線上預約，省去 LINE 等待時間。</p>
      </div>

      <div class="srv-stack">
        <button class="srv blue"><span class="em">📲</span><span class="label">立即預約美甲</span><span class="arrow">→</span></button>
        <button class="srv yellow"><span class="em">💎</span><span class="label">本月新款作品集</span><span class="arrow">→</span></button>
        <button class="srv red"><span class="em">🎀</span><span class="label">新客首次 8 折優惠</span><span class="arrow">→</span></button>
      </div>

      <div class="divider">✨ 👇 請選擇您需要的服務 👇 ✨</div>

      <div class="srv-stack">
        <button class="srv green"><span class="em">💎</span><span class="label">光療美甲</span><span class="arrow">→</span></button>
        <button class="srv blue"><span class="em">🌸</span><span class="label">手部 SPA 護理</span><span class="arrow">→</span></button>
        <button class="srv dark"><span class="em">🧹</span><span class="label">卸甲服務</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">🦶</span><span class="label">足部光療</span><span class="arrow">→</span></button>
        <button class="srv cream"><span class="em">📋</span><span class="label">查看完整價目表</span><span class="arrow">→</span></button>
        <button class="srv pink"><span class="em">💬</span><span class="label">呼叫專人客服</span><span class="arrow">→</span></button>
        <button class="srv light"><span class="em">📅</span><span class="label">我的預約 / 取消</span><span class="arrow">→</span></button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
